datasources {
    default {
        driver-class-name="org.h2.Driver"
        url="jdbc:h2:mem:bloompath;DB_CLOSE_DELAY=-1"
        username="sa"
        password="password"
    }
}
micronaut {
    application {
        name=bloompath
    }
    serde {
        serialization {
          inclusion: ALWAYS
       }
    }
}
langchain4j {
    in-memory {
        embedding-store {
            enabled = false
        }
    }
    ollama {
        base-url = "${OLLAMA_BASE_URL:`http://localhost:11434`}"
        model-name = "gemma4:e4b-mlx"
        chat-model {
            response-format = "json_object"
            timeout=2m
            log-requests = true
            log-responses = true
        }
    }
}
